name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  NODE_OPTIONS: --no-deprecation
  DONGRI_RELEASE_GIT_SHA: ${{ github.sha }}
  DONGRI_CERTIFICATION_MODE: "1"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Guard against hidden or bidi Unicode in workflows
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const workflowDir = path.join(process.cwd(), ".github", "workflows");
          const candidates = fs.existsSync(workflowDir)
            ? fs
                .readdirSync(workflowDir)
                .filter((name) => name.endsWith(".yml") || name.endsWith(".yaml"))
                .map((name) => path.join(workflowDir, name))
            : [];

          const forbiddenRanges = [
            [0x202a, 0x202e], // bidi embedding/override
            [0x2066, 0x2069], // bidi isolates
            [0x200e, 0x200f], // LRM/RLM
            [0x061c, 0x061c], // Arabic letter mark
            [0x200b, 0x200d], // zero-width chars
            [0xfeff, 0xfeff], // BOM/ZWNBSP
          ];

          const findings = [];
          for (const file of candidates) {
            const text = fs.readFileSync(file, "utf8");
            let line = 1;
            let col = 1;
            for (const ch of text) {
              const cp = ch.codePointAt(0);
              const hit = forbiddenRanges.some(([start, end]) => cp >= start && cp <= end);
              if (hit) {
                findings.push({
                  file: path.relative(process.cwd(), file),
                  line,
                  col,
                  cp: `U+${cp.toString(16).toUpperCase().padStart(4, "0")}`,
                });
              }
              if (ch === "\n") {
                line += 1;
                col = 1;
              } else {
                col += 1;
              }
            }
          }

          if (findings.length > 0) {
            console.error("Forbidden hidden/bidi Unicode detected in workflow files:");
            for (const f of findings) {
              console.error(`- ${f.file}:${f.line}:${f.col} ${f.cp}`);
            }
            process.exit(1);
          }

          console.log("Workflow Unicode guard passed.");
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify public repository readiness
        run: |
          pnpm run public:verify
          pnpm run smoke:command-loop:self-test

      - name: Run format check
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint

      - name: Run OpenAPI contract check
        run: pnpm run openapi:check

      - name: Run app and node type checks
        run: |
          pnpm exec tsc -p tsconfig.app.json --noEmit --pretty false
          pnpm exec tsc -p tsconfig.node.json --noEmit --pretty false

      - name: Run build
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run all tests
        run: pnpm run test:ci
        env:
          CI: true
          OAUTH_ENCRYPTION_SECRET: ci-test-encryption-secret
          SESSION_SECRET: ci-test-session-secret

  v1-contract:
    name: v1-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify V1 CI policy and negative gate
        run: |
          pnpm run v1:ci-gate:self-test
          pnpm run v1:ci-gate

      - name: Verify V1 app and node type configurations
        run: |
          pnpm exec tsc -p tsconfig.app.json --noEmit --pretty false
          pnpm exec tsc -p tsconfig.node.json --noEmit --pretty false

      - name: Verify V1 frozen contracts
        run: |
          pnpm run v1:release-identity:certify
          pnpm run v1:openapi-floor
          pnpm run v1:certification-contract:self-test
          pnpm run openapi:check
          pnpm run master95:delivery

      - name: Verify V1 security and durability modules
        run: >-
          pnpm exec vitest run --config server/vitest.config.ts
          server/modules/control-plane/source-adapter.test.ts
          server/modules/control-plane/mutation-authorizer.test.ts
          server/modules/control-plane/mutation-authorizer-sqlite.test.ts
          server/modules/control-plane/event-journal-writer.test.ts
          server/modules/control-plane/image-upload.test.ts
          server/modules/control-plane/projection-service.test.ts
          server/modules/control-plane/certification-contract.test.ts
          server/modules/routes/ops/control-plane-v2.test.ts
          server/modules/routes/ops/control-plane-v2-runtime.test.ts
          server/modules/routes/ops/control-tower.test.ts
          server/modules/routes/ops/image-workbench-v2.test.ts
          server/modules/release/release-identity.test.ts
          server/modules/release/github-release-discovery.test.ts

  windows-candidate:
    name: windows-candidate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        shell: cmd
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify candidate identity and contracts
        shell: cmd
        run: |
          pnpm run v1:ci-gate:self-test
          pnpm run v1:ci-gate
          pnpm run v1:release-identity:certify
          pnpm run v1:openapi-floor
          pnpm run v1:certification-contract:self-test
          pnpm run openapi:check
          pnpm run master95:delivery

      - name: Verify Windows type and build lanes
        shell: cmd
        run: |
          pnpm exec tsc -p tsconfig.app.json --noEmit --pretty false
          pnpm exec tsc -p tsconfig.node.json --noEmit --pretty false
          pnpm run build

      - name: Verify Windows V1 security and routes
        shell: cmd
        run: >-
          pnpm exec vitest run --config server/vitest.config.ts
          server/modules/control-plane/source-adapter.test.ts
          server/modules/control-plane/mutation-authorizer.test.ts
          server/modules/control-plane/mutation-authorizer-sqlite.test.ts
          server/modules/control-plane/event-journal-writer.test.ts
          server/modules/control-plane/image-upload.test.ts
          server/modules/control-plane/projection-service.test.ts
          server/modules/control-plane/certification-contract.test.ts
          server/modules/routes/ops/control-plane-v2.test.ts
          server/modules/routes/ops/control-plane-v2-runtime.test.ts
          server/modules/routes/ops/control-tower.test.ts
          server/modules/routes/ops/image-workbench-v2.test.ts
          server/modules/routes/ops/control-plane.test.ts
          server/modules/release/release-identity.test.ts
          server/modules/release/github-release-discovery.test.ts
