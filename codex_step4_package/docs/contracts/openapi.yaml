openapi: 3.1.0
info:
  title: Local Orchestrator Telegram Bridge API
  version: 0.1.0
paths:
  /api/admin/telegram/settings:
    get:
      summary: Get telegram bridge settings
      responses:
        '200':
          description: Telegram settings
    put:
      summary: Update telegram bridge settings
      requestBody:
        required: true
      responses:
        '200':
          description: Updated settings
  /api/admin/telegram/allowed-chats:
    get:
      summary: List allowlisted chats
      responses:
        '200':
          description: Allowed chats
    post:
      summary: Add or update allowed chat
      requestBody:
        required: true
      responses:
        '200':
          description: Saved chat
  /api/admin/telegram/command-logs:
    get:
      summary: List recent telegram command logs
      responses:
        '200':
          description: Command logs
  /api/admin/telegram/notification-rules:
    get:
      summary: List notification rules
      responses:
        '200':
          description: Notification rules
    put:
      summary: Replace notification rules
      requestBody:
        required: true
      responses:
        '200':
          description: Updated rules
  /api/admin/telegram/test-notification:
    post:
      summary: Send test notification to an allowlisted chat
      requestBody:
        required: true
      responses:
        '200':
          description: Test result
