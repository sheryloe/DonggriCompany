services:
  donggricompany:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: 10001
        APP_GID: 10001
    container_name: donggricompany
    restart: unless-stopped
    mem_limit: ${DOCKER_MEM_LIMIT:-2g}
    cpus: ${DOCKER_CPU_LIMIT:-2.0}
    pids_limit: ${DOCKER_PIDS_LIMIT:-512}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    environment:
      PORT: 7777
      HOST: 0.0.0.0
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      OAUTH_ENCRYPTION_SECRET: ${OAUTH_ENCRYPTION_SECRET:-}
      OAUTH_BASE_URL: ${OAUTH_BASE_URL}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
      DB_PATH: /app/data/claw-empire.sqlite
      LOGS_DIR: /app/data/logs
      OFFICE_RUNNER_DOCKER_ENABLED: 0
      OFFICE_RUNNER_IMAGE: donggricompany-runner:latest
      OFFICE_RUNNER_MAX_ACTIVE: 5
      OFFICE_RUNNER_IDLE_TTL_MS: 900000
      OFFICE_RUNNER_NETWORK: bridge
      CLAW_AGENT_AUTO_TOPUP: 0
    ports:
      - "7777:7777"
      - "8790:7777"
    volumes:
      - ./data:/app/data
      - ./data/office-accounts:/app/.office-accounts
      - ${USERPROFILE}/.codex/multi-auth:/home/app/.codex/multi-auth:ro
    working_dir: /app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7777/api/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
