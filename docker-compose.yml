services:
  donggricompany:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: 10001
        APP_GID: 10001
        DONGRI_RELEASE_GIT_SHA: ${DONGRI_RELEASE_GIT_SHA:-}
        DONGRI_RELEASE_BUILT_AT: ${DONGRI_RELEASE_BUILT_AT:-}
        DONGRI_SOURCE_EPOCH: ${DONGRI_SOURCE_EPOCH:-}
        DONGRI_CERTIFICATION_MODE: ${DONGRI_CERTIFICATION_MODE:-0}
    container_name: donggricompany
    restart: unless-stopped
    mem_limit: ${DOCKER_MEM_LIMIT:-2g}
    cpus: ${DOCKER_CPU_LIMIT:-2.0}
    pids_limit: ${DOCKER_PIDS_LIMIT:-512}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    environment:
      PORT: 8900
      HOST: 0.0.0.0
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      INBOX_WEBHOOK_SECRET: ${INBOX_WEBHOOK_SECRET:-}
      OAUTH_ENCRYPTION_SECRET: ${OAUTH_ENCRYPTION_SECRET:-}
      OAUTH_BASE_URL: ${OAUTH_BASE_URL:-http://127.0.0.1:8900}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
      GMAIL_INTAKE_ENABLED: ${GMAIL_INTAKE_ENABLED:-0}
      GMAIL_INTAKE_SUBJECT_TOKEN: ${GMAIL_INTAKE_SUBJECT_TOKEN:-[DonggriCompany]}
      GMAIL_INTAKE_ALLOWED_SENDERS: ${GMAIL_INTAKE_ALLOWED_SENDERS:-}
      GMAIL_INTAKE_POLL_INTERVAL_MS: ${GMAIL_INTAKE_POLL_INTERVAL_MS:-60000}
      GMAIL_INTAKE_LOOKBACK_DAYS: ${GMAIL_INTAKE_LOOKBACK_DAYS:-14}
      GMAIL_INTAKE_MAX_ATTACHMENT_MB: ${GMAIL_INTAKE_MAX_ATTACHMENT_MB:-10}
      GMAIL_INTAKE_TELEGRAM_SESSION_KEY: ${GMAIL_INTAKE_TELEGRAM_SESSION_KEY:-telegram:global}
      GMAIL_INTAKE_DEFAULT_PROJECT_PATH: ${GMAIL_INTAKE_DEFAULT_PROJECT_PATH:-/workspace/DonggriCompany}
      CALENDAR_INTAKE_ENABLED: ${CALENDAR_INTAKE_ENABLED:-0}
      CALENDAR_INTAKE_CALENDAR_ID: ${CALENDAR_INTAKE_CALENDAR_ID:-primary}
      CALENDAR_INTAKE_MATCH_TOKENS: ${CALENDAR_INTAKE_MATCH_TOKENS:-[DonggriCompany],[Hackathon],[해커톤],해커톤,hackathon}
      CALENDAR_INTAKE_POLL_INTERVAL_MS: ${CALENDAR_INTAKE_POLL_INTERVAL_MS:-60000}
      CALENDAR_INTAKE_LOOKBACK_DAYS: ${CALENDAR_INTAKE_LOOKBACK_DAYS:-1}
      CALENDAR_INTAKE_LOOKAHEAD_DAYS: ${CALENDAR_INTAKE_LOOKAHEAD_DAYS:-60}
      CALENDAR_INTAKE_TELEGRAM_SESSION_KEY: ${CALENDAR_INTAKE_TELEGRAM_SESSION_KEY:-telegram:global}
      CALENDAR_INTAKE_DEFAULT_PROJECT_PATH: ${CALENDAR_INTAKE_DEFAULT_PROJECT_PATH:-/workspace/DonggriCompany}
      TELEGRAM_DEPARTMENT_BOT_ROUTING: ${TELEGRAM_DEPARTMENT_BOT_ROUTING:-0}
      TELEGRAM_GLOBAL_GROUP_CHAT_ID: ${TELEGRAM_GLOBAL_GROUP_CHAT_ID:-}
      TELEGRAM_BOT_TOKEN_DEV: ${TELEGRAM_BOT_TOKEN_DEV:-}
      TELEGRAM_CHAT_ID_DEV: ${TELEGRAM_CHAT_ID_DEV:-}
      TELEGRAM_BOT_TOKEN_QA: ${TELEGRAM_BOT_TOKEN_QA:-}
      TELEGRAM_CHAT_ID_QA: ${TELEGRAM_CHAT_ID_QA:-}
      TELEGRAM_BOT_TOKEN_DESIGN: ${TELEGRAM_BOT_TOKEN_DESIGN:-}
      TELEGRAM_CHAT_ID_DESIGN: ${TELEGRAM_CHAT_ID_DESIGN:-}
      TELEGRAM_BOT_TOKEN_PLANNING: ${TELEGRAM_BOT_TOKEN_PLANNING:-}
      TELEGRAM_CHAT_ID_PLANNING: ${TELEGRAM_CHAT_ID_PLANNING:-}
      TELEGRAM_BOT_TOKEN_PMO: ${TELEGRAM_BOT_TOKEN_PMO:-}
      TELEGRAM_CHAT_ID_PMO: ${TELEGRAM_CHAT_ID_PMO:-}
      TELEGRAM_BOT_TOKEN_CEO_PMO: ${TELEGRAM_BOT_TOKEN_CEO_PMO:-}
      TELEGRAM_CHAT_ID_CEO_PMO: ${TELEGRAM_CHAT_ID_CEO_PMO:-}
      TELEGRAM_BOT_TOKEN_PM: ${TELEGRAM_BOT_TOKEN_PM:-}
      TELEGRAM_CHAT_ID_PM: ${TELEGRAM_CHAT_ID_PM:-}
      TELEGRAM_BOT_TOKEN_OPERATIONS: ${TELEGRAM_BOT_TOKEN_OPERATIONS:-}
      TELEGRAM_CHAT_ID_OPERATIONS: ${TELEGRAM_CHAT_ID_OPERATIONS:-}
      TELEGRAM_BOT_TOKEN_DEVSECOPS: ${TELEGRAM_BOT_TOKEN_DEVSECOPS:-}
      TELEGRAM_CHAT_ID_DEVSECOPS: ${TELEGRAM_CHAT_ID_DEVSECOPS:-}
      DB_PATH: /app/data/claw-empire.sqlite
      LOGS_DIR: /app/data/logs
      PROJECT_PATH_ALLOWED_ROOTS: /app,/workspace/DonggriCompany
      WORKTREE_ADD_TIMEOUT_MS: 120000
      WORKTREE_BASE_DIR: ${WORKTREE_BASE_DIR:-/runtime/worktrees/DonggriCompany}
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace/DonggriCompany
      OFFICE_RUNNER_DOCKER_ENABLED: 0
      OFFICE_RUNNER_IMAGE: donggricompany-runner:latest
      OFFICE_RUNNER_MAX_ACTIVE: 5
      OFFICE_RUNNER_IDLE_TTL_MS: 900000
      OFFICE_RUNNER_NETWORK: bridge
      CLAW_AGENT_AUTO_TOPUP: 0
    ports:
      - "8900:8900"
    volumes:
      - ${DONGGRI_RUNTIME_ROOT:-E:/DonggriPlatform_Asset/runtime/DonggriCompany}/data:/app/data
      - ${DONGGRI_RUNTIME_ROOT:-E:/DonggriPlatform_Asset/runtime/DonggriCompany}/office-accounts:/app/.office-accounts
      - ${DONGGRI_RUNTIME_ROOT:-E:/DonggriPlatform_Asset/runtime/DonggriCompany}/worktrees:/runtime/worktrees/DonggriCompany
      - .:/workspace/DonggriCompany
      - ${USERPROFILE}/.codex/multi-auth:/home/app/.codex/multi-auth:ro
    working_dir: /app
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8900/livez').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
