services:
  donggricompany:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: 10001
        APP_GID: 10001
    container_name: donggricompany
    restart: unless-stopped
    environment:
      PORT: 7777
      HOST: 0.0.0.0
      API_AUTH_TOKEN: __CHANGE_ME__
      DB_PATH: /app/data/claw-empire.sqlite
      LOGS_DIR: /app/data/logs
    ports:
      - "7777:7777"
    volumes:
      - ./data:/app/data
    working_dir: /app
    security_opt:
      - no-new-privileges:true
